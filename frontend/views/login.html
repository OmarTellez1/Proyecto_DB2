<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Ingresar al sitio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="../css/login.css" />
</head>
<body class="auth">
  <div class="panel">
    <h1 class="title">Ingresar al sitio</h1>

    <form id="login-form" class="form">
      <div class="field">
        <span class="icon" aria-hidden="true">
          <!-- user icon -->
          <svg width="20" height="20" viewBox="0 0 24 24" fill="#6b7280"><path d="M12 12a5 5 0 1 0-5-5 5 5 0 0 0 5 5Zm0 2c-5 0-9 2.5-9 5.5A1.5 1.5 0 0 0 4.5 21h15A1.5 1.5 0 0 0 21 19.5C21 16.5 17 14 12 14Z"/></svg>
        </span>
        <input id="user" type="text" inputmode="numeric" autocomplete="username" placeholder="Cédula/Correo/Celular" />
      </div>

      <div class="field">
        <span class="icon" aria-hidden="true">
          <!-- lock icon -->
          <svg width="20" height="20" viewBox="0 0 24 24" fill="#6b7280"><path d="M17 9h-1V7a4 4 0 0 0-8 0v2H7a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7a2 2 0 0 0-2-2Zm-6 8v-3a1 1 0 0 1 2 0v3a1 1 0 0 1-2 0ZM9 7a3 3 0 0 1 6 0v2H9Z"/></svg>
        </span>
        <input id="password" type="password" autocomplete="current-password" placeholder="Contraseña" />
      </div>

      <button id="submit" class="button" type="submit">Ingresar</button>
      <!-- debajo del botón Ingresar -->
      <div id="err" class="error" hidden></div>
      <p id="error" class="error" role="alert" hidden></p>
    </form>

    <footer class="footnote">Trabajo grupal de Base de datos II</footer>
    <script src="../javascript/auth.js"></script>
</div>
</body>
</html>
