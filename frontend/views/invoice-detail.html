<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Detalle de factura</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="/css/layout.css" />
  <link rel="stylesheet" href="/css/invoice-detail.css" />
</head>
<body class="admin">
  <aside class="sidebar"></aside>
  <main class="main">
    <header class="header"><h1>DETALLE DE FACTURA</h1></header>

    <section class="card">
      <div class="top">
        <div><strong>Código:</strong> <span id="code">-</span></div>
        <div><strong>Fecha:</strong> <span id="date">-</span></div>
        <div><strong>Total:</strong> <span id="total">-</span></div>
      </div>

      <div class="grid">
        <div><strong>Cliente:</strong> <span id="c_name">-</span></div>
        <div><strong>CI:</strong> <span id="c_ci">-</span></div>
        <div><strong>Tel:</strong> <span id="c_phone">-</span></div>
        <div><strong>Email:</strong> <span id="c_mail">-</span></div>
      </div>

      <div class="table-wrap">
        <table class="table">
          <thead>
            <tr><th>Cantidad</th><th>Descripción</th><th>V. Unitario</th><th>Total</th></tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script type="module" src="/js/sidebar.js"></script>
  <script type="module" src="/js/invoice-detail.js"></script>
</body>
</html>
