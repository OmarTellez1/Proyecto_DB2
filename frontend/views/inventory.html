<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Ver inventario</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="../css/inventory.css" />
  <link rel="stylesheet" href="../css/layout.css" />
</head>
<body class="admin">
   <aside class="sidebar">
    <div class="brand">Vista administrador</div>
    <nav class="nav">
      <a href="index.html">Inicio</a>
      <a href="user-create.html">Crear Usuario</a>
      <a href="user-list.html">Ver/Modificar Usuarios</a>
      <a class="active"href="inventory.html">Ver Inventario</a>
      <a href="invoices-admin.html">Ver Facturas</a>  
    </nav>
    <a id="logout-button" class="logout" href="#">Cerrar sesión</a>
  </aside>
  <main class="main">
    <header class="header"><h1>VER INVENTARIO</h1></header>
    <section id="grid" class="grid"></section>
  </main>

  <template id="card-tpl">
    <article class="card">
      <div class="thumb" aria-hidden="true">IMG</div>
      <h3 class="name">Producto</h3>
      <p class="desc">Descripción</p>
      <small class="label">Unidades disponibles:</small>

      <div class="actions">
        <input class="stock" type="number" min="0" disabled value="0"/>
        <button class="icon edit" title="Editar" aria-label="Editar">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M20.7 7.3l-4-4a1 1 0 0 0-1.4 0L3 15.6V20h4.4L20.7 8.7a1 1 0 0 0 0-1.4zM7.6 18H5v-2.6L14 6.4 16.6 9 7.6 18z"/></svg>
        </button>
        <button class="icon del" title="Eliminar" aria-label="Eliminar">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M9 3h6l1 2h5v2H3V5h5l1-2zm2 7h2v8h-2v-8zm-4 0h2v8H7v-8zm8 0h2v8h-2v-8z"/></svg>
        </button>
      </div>
    </article>
  </template>
  <script src="../javascript/admin-layout.js"></script>
<script src="../javascript/inventory.js"></script>
</body>
</html>
