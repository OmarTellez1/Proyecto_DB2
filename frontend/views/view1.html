<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Ingresar al sitio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="/css/login.css" />
</head>
<body>
  <main class="login-card">
    <h1>Ingresar al sitio</h1>
    <form id="login-form" autocomplete="on">
      <input id="user" name="user" type="text" inputmode="text" placeholder="Correo / Cédula / Celular" />
      <input id="password" name="password" type="password" placeholder="Contraseña" />
      <button id="btn-login" type="submit">Ingresar</button>
      <div id="err" class="error" hidden></div>
    </form>
    <small>Trabajo grupal de Base de datos II</small>
  </main>

  <script type="module" src="/js/login.js"></script>
</body>
</html>
